# Production configuration for the kube-arangodb operator (Helm chart) into
# the `operators` namespace.
#
# Chart pinned 1.4.5 (latest upstream, June 2026). The CRD API group
# database.arangodb.com/v1 used by arangodb-cluster is unchanged from
# 1.2.x, so the Cluster CR needs no migration; the deployment-replication
# feature was removed upstream and the values wiring dropped with it.
config:
  arangodb-operator:properties:
    chart:
      name: kube-arangodb
      repository: https://arangodb.github.io/kube-arangodb
      version: 1.4.5
secretsprovider: gcpkms://projects/dcr-kube1/locations/us-central1/keyRings/dcr-kube1/cryptoKeys/dcr-kube1
