name: Build and Publish Docker Image

on:
  push:
    branches:
      - master
      - develop

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'

      - name: Build and publish backup image
        env:
          JUST_UNSTABLE: 1
        run: |
          just build-publish-backup-image --ref ${{ github.ref_name }} \
            --user ${{ secrets.DOCKERHUB_USER }} \
            --pass ${{ secrets.DOCKER_PASS }}

