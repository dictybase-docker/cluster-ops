name: Test coverage
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: set up golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: check out code
        uses: actions/checkout@v6
      - name: unit test
        run: go test -covermode=atomic -coverprofile=profile.cov -v ./...
      - name: upload coverage to codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./profile.cov
