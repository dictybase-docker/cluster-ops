# Production configuration for standalone Redis 8 (official image) into the
# `prod` namespace, pinned to the stateful-db pool. Unauthenticated: no
# auth/requirepass — the AOF-protected cache accepts any in-cluster client.
# The stack is initialized on first deploy by `just redis deploy`
# (gcp-pulumi ensure-stack), which adds the cluster-env KMS secretsprovider
# + encryptedkey to this file.
#
# Prerequisites: namespace-bootstrap (prod namespace) + the stateful-db pool.
config:
  redis-standalone:properties:
    image:
      tag: 8.4.6
    namespace: prod
    storage:
      class: dictycr-balanced
      size: 50Gi
    aof: true
    placement:
      pool: database
