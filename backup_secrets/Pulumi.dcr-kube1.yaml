# Production configuration template for backup_secrets
# This stack creates Secret `dictycr` in namespace `prod`, consumed by
# arangodb-backup and arangodb-restore. It creates NO namespaces — the
# namespace-bootstrap stack owns `prod` and `operators` (just gcp-pulumi
# apply-namespaces, docs/pulumi-setup.md §5). Apply this stack BEFORE
# arangodb-operator / arangodb-cluster / create-arangodb-databases.
#
# Configure required secrets before deployment via:
#   just gcp-pulumi set-secret --folder backup_secrets --key properties.secret.resticPass --value "<restic repository password>"
#   just gcp-pulumi set-secret --folder backup_secrets --key properties.secret.gcsProject --value "<gcp-project-id>"
#   just gcp-pulumi set-secret --folder backup_secrets --key properties.secret.serviceAccount.keyname --value "gcsCredentials"
#   just gcp-pulumi set-secret --folder backup_secrets --key properties.secret.serviceAccount.filepath --value "credentials/<project-id>/backup-gcs-sa.json"
#
# properties.secret.serviceAccount.filepath must point to a real GCS service
# account JSON key (Storage Object Admin on the backup bucket) that exists on
# disk where `pulumi up` runs. Create it with `just arangodb setup-backup-sa` —
# it mints credentials/<project-id>/backup-gcs-sa.json with the right IAM grant. — its contents are read and stored as the
# `dictycr` secret's `gcsCredentials` key, matching arangodb-backup's
# bucketSecret.key and this repo's set convention.
config:
  backup_secrets:properties:
    secret:
      name: dictycr
      gcsProject:
        secure: v1:w/qwwk6ejl1Mnzd7:uzaAhmp1TrlTI81Szw0+vjqE6j2R2GAsCg==
      resticPass:
        secure: v1:z08EWdgV4opM9VPx:WthbX3n9Pf8FHRbpy6FO88AMMuodY19Ywgws03D4jSfyRw==
      serviceAccount:
        filepath:
          secure: v1:onGWBnwuIMf8rOEA:cQmpZAaSVI1iRO99FafB3yYkKBum0tMee9GhoVfVeJwvWZdZkrRoH1vw4IxYA6CFOoa8L9okxt0kbnsSflV8lNl23ntitffgz+wzIRY22dG+RTDnvspg611xc5Q24XuxC0ArMzwuiO54
        keyname:
          secure: v1:q8hwAJSMyYiWQiQ6:NxM2nwpePRkumgCTJKvgXv46nrvF82+f7LmcrLMi
secretsprovider: gcpkms://projects/dcr-kube1/locations/us-central1/keyRings/dcr-kube1/cryptoKeys/dcr-kube1
