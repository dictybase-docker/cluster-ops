# Production configuration template for cloudnative-pg-cluster.
# One PostgreSQL 16 cluster (CloudNativePG) on the stateful-db pool.
#
# Project-derived values are set by recipes, not hardcoded here:
#   just postgres configure-backup                  # sets backup.bucket and
#                                                   # backupSecret.filepath
#   just postgres deploy-cluster --app-password ..  # sets the encrypted
#                                                   # bootstrap.userSecret.password
#
# The operand image is the immutable official-catalog tag for PostgreSQL 16,
# `standard` flavor on Debian trixie (the `system` flavor is deprecated;
# bump the tag from the official catalog — see docs/reference/postgres/cluster.md).
config:
  # Pin the GCP project for the pulumi-gcp provider. Without this, provider
  # falls back to GOOGLE_CLOUD_PROJECT env, which can leak a stale value from
  # another cluster env (bucket creates then 403 in the wrong project).
  gcp:project: dcr-kube1
  cloudnative-pg-cluster:properties:
    backupSecret:
      filepath: /Users/sba964/Projects/devenv/golang/cluster-ops/credentials/dcr-kube1/postgres-backup-sa.json
      key: gcsCredentials
      # filepath: set by `just postgres configure-backup`
      # (credentials/<project-id>/postgres-backup-sa.json; its content is
      # stored in this Secret, the path itself is not sensitive)

      name: postgres-backup-credentials
    clusters:
      - cluster:
          backup:
            bucket: cloudnative-pg-backup-dcr-kube1
            # bucket: set by `just postgres configure-backup`
            # (cloudnative-pg-backup-<project-id>)
            bucketLocation: US
            bucketPath: logto
            name: logto
            # retention is applied on the ObjectStore CR (barmancloud.cnpg.io/v1),
            # not on the Cluster — the Barman Cloud plugin owns backup GC.
            retention: 60d
            schedule: 0 0 0 * * *
            target: primary
          bootstrap:
            database: logto
            owner: logto
            userSecret:
              name: logto-app
              # password: set by `just postgres deploy-cluster --app-password`

              password:
                secure: v1:JZ/DDaskht3I9gJE:5jm3SGL2mHd0AugMLUo7b5TqpeqkEz/qPDw6WDbO6iodvw==
          image:
            name: ghcr.io/cloudnative-pg/postgresql
            tag: 16.15-202609101440-standard-trixie
          instances: 1
          name: logto
          namespace: prod
          pgconfig:
            maxConnections: 200
            sharedBuffers: 512MB
          placement:
            podAntiAffinityType: preferred
            pool: database
            topologyKey: topology.kubernetes.io/zone
          storage:
            class: dictycr-balanced
            size: 100Gi
          superuser: true
          walBackup:
            compression: gzip
            maxParallel: 3
