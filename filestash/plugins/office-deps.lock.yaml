# LibreOffice WASM files for application_office, from the plugin Makefile.
# `file` is the name inside lib/lowa/ of the plugin ZIP. The CDN serves
# brotli data, so soffice.wasm and soffice.data keep a .br suffix.
#
# The upstream URLs are "latest" URLs. Fill or refresh sha256 with
# `just filestash lock-office-deps` on a host that can reach the CDN.
# build-plugins refuses to build while any sha256 is empty.
files:
  - file: soffice.js
    url: https://cdn.zetaoffice.net/zetaoffice_latest/soffice.js
    sha256: ""
  - file: soffice.wasm.br
    url: https://cdn.zetaoffice.net/zetaoffice_latest/soffice.wasm
    sha256: ""
  - file: soffice.data.js.metadata
    url: https://cdn.zetaoffice.net/zetaoffice_latest/soffice.data.js.metadata
    sha256: ""
  - file: soffice.data.br
    url: https://cdn.zetaoffice.net/zetaoffice_latest/soffice.data
    sha256: ""
  - file: zeta.js
    url: https://zetaoffice.net/demos/standalone/assets/vendor/zetajs/zeta.js
    sha256: ""
