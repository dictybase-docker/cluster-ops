# Single-writer lock. `filestash-publish` serializes publish and
# unpublish-file. `filestash-maintenance` serializes backup-now and the
# in-place restore. The recipe fills __LEASE__, __NAMESPACE__, and __HOLDER__
# and runs `kubectl create`
# (never apply): create fails with AlreadyExists while another run holds it.
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: __LEASE__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: filestash
spec:
  holderIdentity: __HOLDER__
