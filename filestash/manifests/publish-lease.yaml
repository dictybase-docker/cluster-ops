# Single-writer lock for `just filestash publish` and `unpublish-file`.
# The recipe fills __NAMESPACE__ and __HOLDER__ and runs `kubectl create`
# (never apply): create fails with AlreadyExists while another run holds it.
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: filestash-publish
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: filestash
spec:
  holderIdentity: __HOLDER__
