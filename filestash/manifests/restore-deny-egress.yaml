# Restore test namespace: the restored Filestash pod gets no egress, so the
# restored MinIO keys and SMTP settings cannot reach a live service. The
# restore Job has a different label and keeps egress to Google Cloud
# Storage. The recipe fills __NAMESPACE__.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: filestash-deny-egress
  namespace: __NAMESPACE__
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: filestash
  policyTypes:
    - Egress
  egress: []
