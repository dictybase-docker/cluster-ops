# Production configuration for namespace-bootstrap.
# No secrets required. The stack is initialized on first deploy by
# `just gcp-pulumi apply-namespaces` (gcp-pulumi ensure-stack), which adds the
# cluster-env KMS secretsprovider + encryptedkey to this file.
#
# This stack is the ONLY writer of the shared namespaces. Operator programs
# (cloudnative-pg-operator, arangodb-operator) probe it via StackReference and
# a live GetNamespace read; backup_secrets creates no namespaces.
config:
  namespace-bootstrap:properties:
    operatorNamespace: operators
    appNamespace: prod