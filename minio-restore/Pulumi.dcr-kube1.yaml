# Production configuration template for minio-restore.
#
# Configure a same-cluster DR restore with:
#   just minio configure-restore --namespace prod
#   just minio apply-restore
#
# Configure and run a cross-cluster bootstrap restore with:
#   just minio bootstrap-from-snapshot --namespace prod --bucket <source-bucket>
config:
  minio-restore:properties:
    namespace: prod
    server: minio
    port: 9000
    bucket: restic-minio-backup-dcr-kube1
    storage:
      class: dictycr-balanced
      size: 150Gi
    minioSecret:
      name: minio-root
      userKey: rootUser
      passKey: rootPassword
    resticSecret:
      name: minio-backup-auth
      key: resticPass
    bucketSecret:
      name: minio-backup-auth
      key: gcsCredentials
    projectSecret:
      name: minio-backup-auth
      key: gcsProject
    noLock: false
    overwrite: true
    confirmTarget: prod/minio/drill-20261110-000000
    restoreId: drill-20261110-000000
    snapshot: latest
