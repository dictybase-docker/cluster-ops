# Production configuration template for arangodb-cluster
# Configure required secrets before deployment via:
#   pulumi -C arangodb-cluster -s prod config set --path --secret properties.secret.password "<strong-password>"
config:
  arangodb-cluster:properties:
    name: arangodb
    namespace: prod
    version: 3.12.11
    environment: Production
    architecture: amd64
    tls:
      caSecretName: "None"
    secret:
      name: arangodb-pass
      password:
        secure: v1:va+vEsiUhOY13VLY:PIyI9KLTrS1aXd6QhcMpzlTpLUpRDVrIl8Tafn6RQgCCFw==
    agents:
      count: 3
      storageClass: dictycr-ssd
      storageSize: 20Gi
      cpuRequest: 250m
      memoryRequest: 512Mi
      nodeSelector:
        pool: database
      tolerations:
        - key: dedicated
          operator: Equal
          value: database
          effect: NoSchedule
    dbservers:
      count: 3
      storageClass: dictycr-balanced
      storageSize: 150Gi
      cpuRequest: 500m
      memoryRequest: 1Gi
      nodeSelector:
        pool: database
      tolerations:
        - key: dedicated
          operator: Equal
          value: database
          effect: NoSchedule
    coordinators:
      count: 3
      cpuRequest: 250m
      memoryRequest: 512Mi
      nodeSelector:
        pool: database
      tolerations:
        - key: dedicated
          operator: Equal
          value: database
          effect: NoSchedule
secretsprovider: gcpkms://projects/dcr-kube1/locations/us-central1/keyRings/dcr-kube1/cryptoKeys/dcr-kube1
