# Production configuration template for arangodb-restore.
#
# This is a DESTRUCTIVE, one-off action, not a persistent service — do not
# `pulumi up` this stack against a namespace/server you don't intend to
# overwrite right now. Run it only against a clone cluster or scratch
# namespace, never the live production coordinator, unless you are doing a
# real disaster-recovery restore in place after data loss (not a drill).
#
# Every run needs fresh values for restoreId, snapshot, and confirmTarget —
# there are no defaults for these on purpose. Set them (plus namespace and
# server) in one non-interactive command:
#
#   just arangodb configure-restore --namespace <ns> [--server <svc>] [--restore-id <id>] [--snapshot <snap>]
#
# It discovers the coordinator Service, generates a DNS-1123-safe restoreId
# (drill-<UTC timestamp>) when none is given, computes confirmTarget, and
# runs ensure-stack plus all five set-config calls. Equivalent manual form:
#
#   just gcp-pulumi set-config --folder arangodb-restore --key properties.restoreId --value "<short-dns-safe-id, e.g. drill-2026-06-01>"
#   just gcp-pulumi set-config --folder arangodb-restore --key properties.snapshot --value "latest"   # or a specific restic snapshot ID
#   just gcp-pulumi set-config --folder arangodb-restore --key properties.confirmTarget --value "<namespace>/<server>/<restoreId>"
#
# confirmTarget must exactly equal "<namespace>/<server>/<restoreId>" — this
# is a deliberate safety gate against restoring into the wrong target from a
# stale or copy-pasted config.
#
# THIS FILE IS THE DR-DRILL TEMPLATE: bucket restic-arangodb-backup-prod,
# secrets `dictycr`, restic locking enabled (no noLock key). The cross-project
# first-load path (docs/arangodb-deploy.md §4) reuses this same stack but
# OVERRIDES four things via `just arangodb configure-bootstrap`:
#
#   properties.bucket                -> the SOURCE project's restic bucket
#   properties.resticSecret.name     -> dictycr-source
#   properties.bucketSecret.name     -> dictycr-source
#   properties.projectSecret.name    -> dictycr-source
#   properties.noLock                -> true   (read-only SA cannot write a
#                                               restic lock file; see §2.4 of
#                                               the bootstrap plan)
#
# Those overrides live in stack config, not in this file. `just arangodb
# reset-restore-config` MUST run afterwards (bootstrap-from-snapshot calls it
# from a trap) to put bucket/secrets/noLock back to the values above, so a
# later DR drill cannot silently read the foreign source bucket.
config:
  arangodb-restore:properties:
    namespace: prod
    server: arangodb
    port: 8529
    bucket: restic-arangodb-backup-prod
    storage:
      class: dictycr-balanced
      size: 150Gi
    arangodbSecret:
      name: arangodb-pass
      key: password
    resticSecret:
      name: dictycr
      key: resticPass
    bucketSecret:
      name: dictycr
      key: gcsCredentials
    projectSecret:
      name: dictycr
      key: gcsProject
